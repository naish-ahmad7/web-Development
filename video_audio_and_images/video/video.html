<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
  </head>
  <body>
    <h1>Vide from Direct file</h1>
    <!-- Video is a direct link/file -->
    <div>
      <video src="video.mp4.mp4" width="600" height="450" controls>
        Nature Video
      </video>
    </div>

    <div>
      <video
        src="karan_aujla.mp4"
        poster="karan.jpg"
        width="600"
        height="450"
        controls
        autoplay
        muted
        loop 
      >
        Karan Aujla
      </video>
    </div>

    <!-- autoplay         Starts automatically
          muted            No sound on start
          loop            Repeats forever
         controls         Shows play/pause buttons
         poster           like thumbnail of the video. it shows before the start of the video
    -->

    <h1>Video From Youtube</h1>

    <!-- video is on youtube then we will use frame -->
    <iframe
      width="800"
      height="400"
      src="https://www.youtube.com/embed/kwhfmFhQ_fc?si=UQ0zRhSB1FTGogAs"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
