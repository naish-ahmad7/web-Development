<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-Basics</title>

    <style>
      h1 {
        /* h1 is selector  */
        color: red; /*color is property 
                        red is value 
                        and ( color: red; ) this is called declaration*/
      }

      /* we can use multiple selector  */
      p,
      div {
        color: purple;
        background-color: burlywood; /* background is also property */
      }
    </style>
  </head>
  <body>
    <h1>Introduction to CSS</h1>
    <p>CSS - stands for (Cascading Style Sheets)</p>
    <p>CSS is a stylesheet language. It is used to style web pages.</p>
    <div>Good bye!</div>
  </body>
</html>
