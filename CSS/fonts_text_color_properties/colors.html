<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Colors</title>
    <style>
    
    div h1
    {
        text-transform: capitalize;

        /* Color keyword */
        /* color: brown;   */

        /* HEX code */
        /* color: #6FC7E3; */

        /* RGB */
        color: rgb(102, 44, 212);

        /* RGBA */
        /* color: rgba(57, 198, 92, 0.822); */

        /* HSL */
        /* color: hsl(39, 83%, 43%); */

        background-color: #6FC7E3; ;
    }  




    </style>
</head>
<body>
    <div>
        <h1>ways to write colors</h1>
        <ol>
            <li>Color keyword</li>
            <li>Color Hex code</li>
            <li>RGB (Red, Green, Blue)</li>
            <li>RGBA (RGB + Alpha ( Transparency or opacity level))</li>
            <li>HSL ( Hue, Saturation, Lightness) </li>
        </ol>
    </div>
</body>
</html>
