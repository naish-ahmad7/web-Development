<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selector MasterClasses</title>

    <style>
      /* universal selector - It applies the same CSS rules to all elements. */
      * {
        margin: 5px;
        padding: 5px;
      }

      /* Element selector - same style to every HTML tag of a particular type. */
      p {
        color: red;
      }

      /* class selector - want to style specific elements, not every element of the same type.  */

      .brown {
        color: brown;
      }

      /* ID selector - use to design the unique Html element */
      /* two element cannot have the same ID  */

      #CNIC p {
        color: blue;
      }

      /* grouping selector */
      h2,
      h3 {
        color: aqua;
      }

      /* Descendant Selector - selects elements inside another element. */

      main p {
        color: blueviolet;
      }

      /* child selector - selects only the direct child of an element. */

      section > p {
        color: burlywood;
      }

      /* Pseudo selector  */

      /* Hover - Changes the style when the mouse is over an element */
      h2:hover {
        color: black;
      }
      
      /* ACtive - Used while an element is being clicked. */
      h3:active{
        background-color: black;
      }
    
     /* :hover
     :active
     :nth-child()
     :first-child
     :last-child
     :focus */
      
    </style>
  </head>
  <body>
    <div>
      <h1>Welcome back!</h1>
      <p>Hello World!</p>
    </div>

    <div class="brown">
      <h1>I hope you will do something helpfull this july.</h1>
    </div>

    <div id="CNIC">
      <p>CNIC:</p>
      <p>35102-4524546-4</p>
    </div>

    <h2>About Me</h2>
    <h3>About you</h3>

    <main>
      <p>Hi, i want to do something new.</p>
    </main>

    <section>
      <p>okay, we will do it.</p>

      <div>
        <p>sure!</p>
      </div>
    </section>

  </body>
</html>
