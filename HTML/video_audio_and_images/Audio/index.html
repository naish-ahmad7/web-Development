<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio</title>
  </head>
  <body>
    <!-- poster attribute
        
       It tells the browser what to load from the video/audio before user plays it.

       preload="none"-> Browser loads nothing until user clicks play
       Good for slow internet — saves data Video takes time to start when clicked
       
       preload="metadata" -> Browser loads only basic info:

        Duration (length of video)
        Video size
        First frame

        ✅ Default behavior in most browsers
        ✅ Good balance between speed and data
       
       preload="auto" ->  Browser loads the entire video when page opens
       Video starts instantly when clicked❌ Uses more internet data
       
       
       -->

    <h2>Karan Aujla song in Audio Form</h2>

    <audio src="karan_aujla.mp3" style="width: 350px "  controls></audio>
  </body>
</html>
