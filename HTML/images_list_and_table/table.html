<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Student Details</h3>
    <table border="1">

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>CGPA</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Naish</td>
                <td>20</td>
                <td>3.74</td>
            </tr>
            <tr>
                <td>Ahmad</td>
                <td>21</td>
                <td>3.5</td>
            </tr>
            <tr>
                <td>Ali</td>
                <td>20</td>
                <td>3.67</td>
            </tr>
            <tr>
                <td colspan="2">Raza</td>   <!-- merges Name + Age columns -->
                <td rowspan="2">3.12</td>   <!-- merges CGPA of Raza + Awais rows -->
            </tr>
            <tr>
                <td>Awais</td>
                <td>22</td>
                <!-- no CGPA td here, rowspan is covering it -->
            </tr>
        </tbody>

        <tfoot>
            <tr>                            
                <td colspan="2">Average CGPA</td>
                <td>2.8</td>
            </tr>
        </tfoot>

    </table>
</body>
</html>
